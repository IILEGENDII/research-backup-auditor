name: Tests
on: [push, pull_request]
permissions:
  contents: read

jobs:
  unit:
    name: Unit and packaging (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.15'}
          - {os: macos-latest, python: '3.14'}
          - {os: windows-latest, python: '3.14'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q -rs -m "not integration"
      - run: python -m build
      - run: research-recovery --help
      - run: research-recovery --version
      - run: python -m research_recovery --version

  recovery:
    name: Synthetic restic recovery (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[dev]"
      - name: Verify and unpack restic 0.20.0
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base=https://github.com/restic/restic/releases/download/v0.20.0
          archive=restic_0.20.0_linux_amd64.bz2
          curl -fsSL --retry 3 "$base/SHA256SUMS" -o SHA256SUMS
          echo "57850f4ec5257e288388f708c9866eea83f9d8a91f103f48408be63af1a709f3  SHA256SUMS" | sha256sum --check
          curl -fsSL --retry 3 "$base/$archive" -o "$archive"
          grep -F "  $archive" SHA256SUMS | sha256sum --check
          echo "0ccd9fa7885074a24603b051e01bf9bd8b5e45d6a1791e9d9887e9e9372107f7  $archive" | sha256sum --check
          bzip2 -dc "$archive" > restic
          chmod 0755 restic
          ./restic version
          echo "AUDITOR_TEST_RESTIC=$RUNNER_TEMP/restic" >> "$GITHUB_ENV"
      - run: python -m pytest -q -rs -m integration
      - name: Run the public demo command
        run: |
          workspace=$(mktemp -d "$RUNNER_TEMP/auditor-demo.XXXXXXXX")
          research-recovery demo --workspace "$workspace" --restic "$AUDITOR_TEST_RESTIC" --format json
