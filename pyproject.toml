[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "research-backup-auditor"
version = "0.1.0"
description = "Audit local restic snapshots and test recovery in isolated workspaces"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "build>=1.2"]

[project.scripts]
research-recovery = "research_recovery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["integration: uses a verified restic binary and disposable local fixtures"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".local"]
